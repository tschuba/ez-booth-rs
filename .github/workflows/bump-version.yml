name: Bump Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New version (X.Y.Z — no v prefix)'
        required: true
        type: string
      notes:
        description: 'Release notes for the annotated tag (optional, falls back to "Release vX.Y.Z")'
        required: false
        type: string

permissions:
  contents: write

jobs:
  bump:
    name: Bump version and push release tag
    runs-on: ubuntu-latest

    steps:
      - name: Validate inputs
        shell: bash
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be X.Y.Z format (e.g. 0.2.0), got: ${{ inputs.version }}"
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Bump Version must be run from the main branch, not: $GITHUB_REF"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag does not already exist
        shell: bash
        run: |
          if git ls-remote --tags origin "refs/tags/v${{ inputs.version }}" | grep -q .; then
            echo "::error::Tag v${{ inputs.version }} already exists on remote"
            exit 1
          fi

      - name: Bump Cargo.toml and Cargo.lock
        shell: bash
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          old_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"

          if [[ -z "$old_version" ]]; then
            echo "::error::Could not read current version from Cargo.toml"
            exit 1
          fi

          if [[ "$old_version" == "$NEW_VERSION" ]]; then
            echo "::error::New version ($NEW_VERSION) is the same as the current version"
            exit 1
          fi

          # Update workspace version in Cargo.toml
          sed -i "s/^version = \"${old_version}\"$/version = \"${NEW_VERSION}\"/" Cargo.toml

          # Verify substitution
          actual="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$actual" != "$NEW_VERSION" ]]; then
            echo "::error::sed substitution failed; Cargo.toml still has ${actual}"
            exit 1
          fi

          # Update version entries in Cargo.lock for workspace-local crates.
          # Workspace members have no 'source = ...' line; registry crates do.
          # We only touch blocks where version matches the old workspace version.
          OLD_VERSION="$old_version" python3 << 'PYEOF'
          import re, os

          old_ver = os.environ['OLD_VERSION']
          new_ver = os.environ['NEW_VERSION']

          with open('Cargo.lock') as f:
              content = f.read()

          blocks = re.split(r'(?=\[\[package\]\])', content)
          updated = 0
          out = []
          for block in blocks:
              if ('version = "' + old_ver + '"' in block and
                      'source = ' not in block and
                      '[[package]]' in block):
                  block = block.replace(
                      'version = "' + old_ver + '"',
                      'version = "' + new_ver + '"',
                      1,
                  )
                  updated += 1
              out.append(block)

          with open('Cargo.lock', 'w') as f:
              f.write(''.join(out))

          print(f'Updated {updated} workspace package(s) in Cargo.lock: {old_ver} → {new_ver}')
          PYEOF

          git diff --stat Cargo.toml Cargo.lock

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and tag
        shell: bash
        env:
          NOTES: ${{ inputs.notes }}
          NEW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump version to ${NEW_VERSION}"

          tag_message="${NOTES:-Release v${NEW_VERSION}}"
          git tag -a "v${NEW_VERSION}" -m "$tag_message"

      - name: Push commit and tag
        shell: bash
        run: |
          git push origin HEAD:main
          git push origin "v${{ inputs.version }}"
