name: Tag Release

# Fires when a version-bump PR merges to main (Cargo.toml changes).
# Creates the annotated release tag → triggers release.yml and deploy-pages.yml.

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml

permissions:
  contents: write

jobs:
  tag:
    name: Create release tag if workspace version changed
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect version change and push tag
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          curr_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -1)"
          prev_version="$(git show "${BEFORE_SHA}:Cargo.toml" 2>/dev/null \
            | sed -n 's/^version = "\([^"]*\)"$/\1/p' | head -1 || echo '')"

          if [[ -z "$curr_version" ]]; then
            echo "::error::Could not read workspace version from Cargo.toml"
            exit 1
          fi

          if [[ "$curr_version" == "$prev_version" ]]; then
            echo "Workspace version unchanged ($curr_version) — skipping tag."
            exit 0
          fi

          echo "Version changed: ${prev_version:-<none>} → ${curr_version}"

          if git ls-remote --tags origin "refs/tags/v${curr_version}" | grep -q .; then
            echo "Tag v${curr_version} already exists — skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "v${curr_version}" -m "Release v${curr_version}"
          git push origin "v${curr_version}"
          echo "Tagged and pushed v${curr_version}"
