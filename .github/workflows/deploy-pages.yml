name: Deploy Pages

on:
  workflow_run:
    workflows: ["Tag Release"]
    types: [completed]
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/deploy-pages.yml
      - README.md

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Cancel in-progress docs deploys; never cancel a release deploy.
  cancel-in-progress: ${{ github.event_name != 'workflow_run' }}

jobs:
  build:
    name: Build Pages Site
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: docs
          destination: ./_site

      # ── WASM steps run only on release tags ──────────────────────────

      - name: Setup WASM build environment
        if: github.event_name == 'workflow_run'
        uses: ./.github/actions/setup-wasm-build

      - name: Build Kassen-App WASM
        if: github.event_name == 'workflow_run'
        env:
          LABELS_PUBLIC_URL: https://tschuba.github.io/ez-booth-rs/labels/
          ROUTER_BASE: /ez-booth-rs/pos
        run: trunk build --release --public-url /ez-booth-rs/pos/
        working-directory: crates/ez-booth-app

      - name: Merge WASM bundle into site
        if: github.event_name == 'workflow_run'
        run: |
          sudo mkdir -p _site/pos
          sudo cp -R crates/ez-booth-app/dist/. _site/pos/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    name: Deploy Pages Site
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
