title: EZ Booth Documentation
description: Documentation for the ez-booth-rs browser-based flea market booth management system.
theme: just-the-docs
color_scheme: light
url: https://tschuba.github.io
baseurl: /ez-booth-rs
repository: tschuba/ez-booth-rs
permalink: pretty
search_enabled: true
search.button: true
heading_anchors: true
back_to_top: true
back_to_top_text: Back to top
plugins:
  - jekyll-relative-links
relative_links:
  enabled: true
  collections: true
aux_links:
  GitHub Repository:
    - https://github.com/tschuba/ez-booth-rs
aux_links_new_tab: true
footer_content: 'Published with GitHub Pages using just-the-docs.'
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
