<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Booth - Flohmarktstand-Verwaltung</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom styles -->
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Print styles for vendor reports */
        @media print {
            /* Page setup */
            @page {
                margin: 1.5cm 1cm 1cm 1cm;
                size: A4;
            }
            
            /* Remove all padding/margins in print */
            body, html {
                margin: 0 !important;
                padding: 0 !important;
            }
            
            /* Table styling */
            table {
                width: 100%;
                border-collapse: collapse;
            }
            
            /* Attempt to repeat thead (may not work in Safari, but doesn't hurt) */
            thead {
                display: table-header-group;
            }
            
            tbody {
                display: table-row-group;
            }
            
            /* Avoid breaking rows in the middle */
            tr.avoid-page-break {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            
            /* Page breaks between vendors */
            .page-break-before {
                page-break-before: always;
                break-before: page;
            }
            
            /* Hide screen-only elements */
            .print\\:hidden {
                display: none !important;
            }
            
            /* Show print-only elements */
            .hidden.print\\:block {
                display: block !important;
            }
        }
    </style>
</head>
<body>
    <noscript>Sie müssen JavaScript aktivieren, um diese Anwendung zu verwenden.</noscript>
    <div id="app"></div>
</body>
</html>
