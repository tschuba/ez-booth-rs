<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Booth - Flohmarktstand-Verwaltung</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom styles -->
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Print styles for vendor reports */
        @media print {
            /* Page setup */
            @page {
                margin: 1.5cm 1cm 1cm 1cm;
                size: A4;
            }
            
            /* Remove padding in print to simplify structure */
            .print-vendor-reports {
                padding: 0 !important;
                max-width: none !important;
                margin: 0 !important;
            }
            
            /* Table print styles */
            table {
                page-break-inside: auto;
                width: 100%;
            }
            
            thead {
                display: table-header-group;
            }
            
            tbody {
                display: table-row-group;
            }
            
            tfoot {
                display: table-footer-group;
            }
            
            tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }
            
            /* Avoid page breaks inside transaction groups */
            .transaction-group {
                page-break-inside: avoid;
            }
            
            /* Print page header styling */
            .print-page-header-box {
                display: block;
                background: #f3f4f6;
                border-bottom: 2px solid #1f2937;
                padding: 0.5rem 1rem;
                margin-bottom: 0.5rem;
                font-weight: 600;
                font-size: 11pt;
            }
        }
        
        @media screen {
            /* Hide print headers on screen */
            .print-page-header-box {
                display: none;
            }
        }
    </style>
</head>
<body>
    <noscript>Sie müssen JavaScript aktivieren, um diese Anwendung zu verwenden.</noscript>
    <div id="app"></div>
</body>
</html>
