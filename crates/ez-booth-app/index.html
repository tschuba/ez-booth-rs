<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZ Booth - Flohmarktstand-Verwaltung</title>
    
    <!-- Tailwind CSS with print variant configuration -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {}
            }
        }
    </script>
    
    <!-- Custom styles -->
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Print styles for vendor reports */
        @media print {
            /* Page setup */
            @page {
                margin: 1.5cm 1cm 1cm 1cm;
                size: A4;
            }
            
            /* Print-specific page breaks */
            .page-break-before {
                page-break-before: always;
                break-before: always;
            }
            
            .page-break-after {
                page-break-after: always;
                break-after: always;
            }
            
            /* Avoid breaking inside transaction groups */
            .avoid-page-break {
                page-break-inside: avoid;
                break-inside: avoid;
            }
            
            /* CRITICAL: Hide screen view, show print view */
            .print\\:hidden {
                display: none !important;
            }
            
            .hidden.print\\:block {
                display: block !important;
            }
        }
        
        /* CRITICAL: Hide print view on screen */
        @media screen {
            .hidden.print\\:block {
                display: none !important;
            }
            
            /* Add visual separator between reports for screen preview */
            .page-break-before {
                border-top: 2px dashed #ccc;
                margin-top: 2rem;
                padding-top: 2rem;
            }
        }
    </style>
</head>
<body>
    <noscript>Sie müssen JavaScript aktivieren, um diese Anwendung zu verwenden.</noscript>
    <div id="app"></div>
</body>
</html>
